<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <script src="js/menu.js" defer></script>
        <title>Catalogue</title>
    </head>
    <body>
        <header>
            <nav class="nav-menu" aria-label="Navigation principale">
                <div class="nav-menu__logo">
                    <p class="logo__texte">FOULÉE</p>
                </div>

                <!-- Bouton Menu / Fermer -->
                <button class="nav-menu__toggle" aria-expanded="false" aria-controls="nav-menu-list" aria-label="Ouvrir le menu de navigation">
                    <!-- L'icône doit être positionnée en premier pour le sélecteur CSS adjacent (+) -->
                    <span class="nav-menu__hamburger-icon" aria-hidden="true"></span>
                    <span class="nav-menu__libelle">Menu</span>
                </button>

                <!-- Liste des liens de navigation -->
                <ul id="nav-menu-list" class="nav-menu__list">
                    <li class="nav-menu__item">
                        <a href="#home" class="nav-menu__link">Hommes</a>
                    </li>
                    <li class="nav-menu__item">
                        <a href="#services" class="nav-menu__link">Femmes</a>
                    </li>
                    <li class="nav-menu__item">
                        <a href="#about" class="nav-menu__link">Enfants</a>
                    </li>
                    <li class="nav-menu__item">
                        <a href="#contact" class="nav-menu__link">Sport</a>
                    </li>
                    <li class="nav-menu__item">
                        <a href="#contact" class="nav-menu__link">Personnaliser</a>
                    </li>
                    <li class="nav-menu__item">
                        <a href="#contact" class="nav-menu__link">Foulée +</a>
                    </li>
                </ul>
                <div class="partie-droite">
                    <div class="partie_droite__bar-recherche">
                        <p class="bar-recherche__texte">Recherche</p>
                        <img src="images/svg/Loupe.svg" alt="Loupe" />
                    </div>
                    <div class="partie-droite__panier">
                        <img src="images/svg/Panier.svg" alt="Panier" />
                    </div>
                </div>
            </nav>
        </header>
        <main class="contenu-pricipal">
            <div class="contenu-pricipal__entete-secondaire">
                <p class="entete-secondaire__fil-dariane">Accueil > Chaussires</p>
                <h1 class="entete-secondaire__titre-principale titre-pricipale">Chaussures</h1>
                <p class="entete-secondaire__nombres-produits">12 produits</p>
                <div class="entete-secondaire__sorte-chaussure">
                    <div class="sorte-chaussure__btn-sorte-actif btn-sorte-actif">Tous</div>
                    <div class="sorte-chaussure__btn-sorte-initial btn-sorte-initial">Hommes</div>
                    <div class="sorte-chaussure__btn-sorte-initial btn-sorte-initial">Femems</div>
                    <div class="sorte-chaussure__btn-sorte-initial btn-sorte-initial">Enfants</div>
                </div>
            </div>
            <div class="contenu-principal__section-info-filtres">
              <button class="section-info-filtres__btn-filtres">Masquer les filtres</button>
              <label for="tirer" class="section-info-filtres__label">Trier par</label>
              <select name="trier" id="trier" class="section-info-filtres__menu-select">
                <option value="nouvautes">Nouveautés</option>
              </select>
            </div>
            <div class="contenu-principal__section-chaussures">
              <div class="section-chaussures__carte carte-chaussure-nouveau">
                <div class="carte__nouveau">
                  Nouveau
                </div>
                <picture class="carte__picture-chaussure">
                    <source media="(max-width: 16.25rem)" srcset="images/men_AirForceFlynit_01_w260.jpg" type="image/jpg">
                    <source media="(max-width: 32.5rem)" srcset="images/men_AirForceFlynit_01_w520.jpg" type="image/jpg">
                    <img src="images/men_AirForceFlynit_01_w260.jpg" alt="">
                </picture>
                <div class="carte__genre">
                    Hommes
                </div>
                <div class="carte__nom">
                    Air Force Flyknit
                </div>
                <div class="carte__nombre-couleurs">
                    3 couleurs
                </div>
                <div class="carte__prix">
                    $129,99
                </div>
                <div class="carte__btn-ajout-panier">
                    Ajouter au panier
                </div>
              </div>
            </div>
        </main>
    </body>
</html>
