<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <script src="js/menu.js" defer></script>
    <title>Accueil</title>
</head>
<body>
    <header>
      <nav class="nav-menu" aria-label="Navigation principale">
        <div class="nav-menu__logo">
            <p class="logo__texte">FOULÉE</p>
        </div>

        <!-- Bouton Menu / Fermer -->
        <button
          class="nav-menu__toggle"
          aria-expanded="false"
          aria-controls="nav-menu-list"
          aria-label="Ouvrir le menu de navigation"
        >
          <!-- L'icône doit être positionnée en premier pour le sélecteur CSS adjacent (+) -->
          <span class="nav-menu__hamburger-icon" aria-hidden="true"></span>
          <span class="nav-menu__libelle">Menu</span>
        </button>

        <!-- Liste des liens de navigation -->
        <ul id="nav-menu-list" class="nav-menu__list">
          <li class="nav-menu__item">
            <a href="#home" class="nav-menu__link">Hommes</a>
          </li>
          <li class="nav-menu__item">
            <a href="#services" class="nav-menu__link">Femmes</a>
          </li>
          <li class="nav-menu__item">
            <a href="#about" class="nav-menu__link">Enfants</a>
          </li>
          <li class="nav-menu__item">
            <a href="#contact" class="nav-menu__link">Sport</a>
          </li>
          <li class="nav-menu__item">
            <a href="#contact" class="nav-menu__link">Personnaliser</a>
          </li>
          <li class="nav-menu__item">
            <a href="#contact" class="nav-menu__link">Foulée +</a>
          </li>
        </ul>
        <div class="partie-droite">
            <div class="partie_droite__bar-recherche">
                <p class="bar-recherche__texte">Recherche</p>
                <img src="" alt="Loupe">
            </div>
            <div class="partie-droite__panier">
              <img src="" alt="Panier">
            </div>    
        </div>
      </nav>
    </header>
</body>
</html>
